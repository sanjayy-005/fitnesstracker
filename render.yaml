# Render Blueprint for the FitTrack API (Django).
# In Render: New + > Blueprint > pick your GitHub repo. Render reads this file.
# The frontend is deployed separately on Cloudflare Pages (see README.md).
services:
  - type: web
    name: fittrack-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DB_ENGINE
        value: postgresql
      # Use the Supabase Session pooler connection details (not the direct connection).
      # Set DB_HOST, DB_PORT, DB_USER, and DB_PASSWORD from Supabase's connection info.
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_SSLMODE
        value: require
      # Custom API hostname, e.g. api.example.com. Render hostname is added automatically.
      - key: ALLOWED_HOSTS
        sync: false
      # Cloudflare Pages frontend origin, e.g. https://example.com (no trailing slash).
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: TIME_ZONE
        value: Asia/Kolkata
      # Loads demo data on the first deploy (skipped if the database already has data).
      # Set to "false" afterwards, and change the demo passwords before sharing the link.
      - key: SEED_DEMO_DATA
        value: "true"
      - key: FOOD_AI_ENABLED
        value: "true"
      - key: FOOD_AI_PROVIDER
        value: "mock"
      - key: FOOD_AI_BASE_URL
        value: https://router.huggingface.co/v1
      - key: FOOD_AI_MODEL
        value: Qwen/Qwen2.5-VL-7B-Instruct
      - key: FOOD_AI_API_KEY
        sync: false
      - key: FOOD_AI_STRUCTURED_OUTPUT
        value: json_schema
